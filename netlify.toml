[build]
  # Explicit `prisma generate` guards against a stale bundled Prisma
  # Client when schema.prisma changes but Netlify's dependency cache
  # skips re-running npm's postinstall hook. `prisma migrate deploy`
  # applies any pending migrations to whichever DATABASE_URL this
  # deploy context injects (production DB on master, Neon `development`
  # branch DB on the dev branch-deploy) -- deliberately NOT in
  # package.json's build script, since that also runs locally.
  command = "npx prisma generate && npx prisma migrate deploy && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Clean /api/* paths -> the matching function file (e.g. /api/cart/123 ->
# netlify/functions/cart.js, with "123" available as extra path segments).
# netlify/functions/auth.js opts out of this via its own `config.path`
# (v2 function), so Better Auth's /api/auth/* routes are handled directly
# by Netlify's function router before this catch-all applies.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so react-router's client-side routes (e.g. /product/:id)
# don't 404 on a direct load/refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
